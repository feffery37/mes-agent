# iMES 设备洞察 Agent 应用配置
#  app_config
# 运行时由 core/config.py 读取，可被环境变量(.env)覆盖

# 智能体(Agent)运行配置
agent:
  name: "equipment_insight"
  max_iterations: 12          # ReAct 最大迭代轮次
  max_retries: 3              # LLM / 工具调用失败最大重试次数
  retry_interval: 1.0         # 重试间隔(秒)

# 大语言模型(LLM)配置 —— 兼容 OpenAI 协议，默认对接 DeepSeek
llm:
  provider: "openai"          # openai(真实) | mock(本地演示，无需 API Key)
  base_url: "https://api.deepseek.com"
  api_key: ""                 # 留空则自动回退到 mock 模式
  model_name: "deepseek-chat"
  temperature: 0.0
  max_tokens: 2048

# MCP 协议配置（基础框架预留扩展位）
mcp:
  servers: []

# 数据源配置（基础框架使用内置样本数据，后续可替换为真实时序库/数仓）
data_source:
  use_sample_data: true

# 消息推送（人在回路：模型只生成草稿，用户点击发送后才外发）
notify:
  enabled: true               # 总开关，false 一键静默
  default_channels: ["wecom"]
  channels:
    wecom:
      enabled: true
      webhook_env: WECOM_WEBHOOK_URL   # 只写变量名，值放 .env
  retry: 2
  timeout_seconds: 5

# SPC 控制图判异（只读分析工具，不触发任何写操作 / 自动通知）
spc:
  enabled: true
  sigma_method: "mad"         # mad（稳健）| mr（I-MR 移动极差）
  baseline_window_hours: 720  # 用受控基线期估 σ，不能用含漂移的当前窗口
  rules: ["N1", "N2", "N3", "N5", "N6", "C1"]
  n_min: 10                   # 少于该点数直接【无法判断】
  downgrade_n: 30             # 少于该点数降级【推测】
  c1_min_points: 3            # 自定义规则：连续几点超 ±1σ 且呈线性
  c1_min_slope: 0.0
  require_two_rules: true     # 防误报：非 critical 时需 ≥2 条规则才判「失控」
  max_segments_per_rule: 5    # 同规则多段明细展示上限（总数仍如实给出）
